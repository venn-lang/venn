name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance: the registry verifies the build came from
      # this workflow, in this repository, at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --sort run build

      # The release pull request skips CI, since it carries no code and its run
      # would wait on a human every time. This is where that verification
      # happens instead: on main, against exactly what is about to be published,
      # which is a better place to check than the pull request that proposed it.
      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # When npm rejects the credentials, changesets reports a bare TypeError
      # from deep inside its own error handling, which says nothing about what
      # went wrong. Asking the registry first turns that into a sentence. It
      # only warns: a run that just opens the version pull request needs no
      # credentials at all, and should not fail for the want of them.
      - name: Check the npm credentials
        continue-on-error: true
        run: |
          if who=$(npm whoami 2>&1); then
            echo "npm accepted the token, authenticated as $who"
          else
            echo "::warning::npm rejected the token: $who. Publishing will fail until the NPM_TOKEN secret is replaced."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Keeps a "Version Packages" pull request up to date while changesets
      # accumulate. Merging it is what publishes.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Both names, for two readers of the same secret. `setup-node` writes
          # an .npmrc that reads NODE_AUTH_TOKEN, while the action itself looks
          # for NPM_TOKEN to decide whether it has credentials at all. With only
          # the first, it reported none and fell back to trusted publishing,
          # which nothing here is set up for, and the publish failed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  sbom:
    name: SBOM
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # GitHub already derives an SPDX document from the dependency graph. This
      # one is generated from the tree that was actually installed, so it
      # describes the artefact rather than the manifest.
      - name: Generate CycloneDX SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm --output-format json --output-file sbom.json --omit dev

      - name: Attach to the latest release
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$tag" ]; then gh release upload "$tag" sbom.json --clobber; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
