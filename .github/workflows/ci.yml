name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Building and testing twice over to check a typo in a README costs five
  # minutes of runner and proves nothing. This decides in about ten seconds.
  #
  # Deciding here rather than with `paths-ignore` is the point. A workflow that
  # does not run reports no check at all, and a required check that never
  # reports leaves the pull request waiting for it forever. A job that is
  # skipped does report, and counts as passed.
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/changed
      - id: decide
        uses: ./.github/actions/changed

  verify:
    name: verify (${{ matrix.os }})
    needs: changes
    # The release pull request carries no code, only version numbers and
    # changelogs, and it is opened by a bot, so its run would sit waiting for a
    # human to approve it every single release. What it does change is verified
    # by the release workflow itself, on main, right before publishing.
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Most of this was written on Windows and path handling differs there,
        # so it is not enough to be green on Linux alone.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Third-party install scripts run arbitrary code. Nothing here needs them.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Build first: typecheck resolves @venn-lang/* through the emitted declarations
      # in dist, so it has nothing to read until the packages are built.
      - name: Build
        run: pnpm -r --sort run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      # Coverage on Linux only: the figure is the same on both, and paying for
      # it twice buys nothing.
      - name: Test
        if: matrix.os == 'windows-latest'
        run: pnpm test

      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage

      # The slug is spelled out rather than inferred. Codecov asks for it, and
      # the uploads that were refused with "Repository not found" were the ones
      # that left it to be worked out.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: venn-lang/venn
          fail_ci_if_error: false

      # The examples are documentation, and documentation that stopped working
      # is a defect. This is the check that catches it.
      - name: Check the examples
        run: node packages/cli/dist/bin/venn-run.mjs check examples/

      # `check` was the only command the examples ever met, and it is the one
      # that was never broken: it type-checked while `run` and `test` did not,
      # so the two commands that execute code were the two nothing exercised.
      #
      # This drives all seventy-eight through `run` or `test` and compares the
      # exit status, the assertion counts and both output streams against what
      # is committed. Exit status alone is not enough and provably so: `venn
      # test` on a file with no flows exits 0 saying `0 passed, 0 failed`.
      # `node scripts/examples-run.mjs --write` re-records after a change.
      - name: Run every example and compare what it printed
        run: node scripts/examples-run.mjs --check

      # A dash or an assistant's name in a commit subject is the one rule an
      # agent breaks by default, and `no-dashes.test.mjs` reads `git ls-files`,
      # which by construction never sees a commit message or a title.
      - name: Check the commit subjects and the title
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/subjects-are-clean.mjs "$BASE" "$HEAD" "$TITLE"

      # Only the built binary can answer this. The version is read from the
      # manifest by walking up from the running file, and the bundle sits at a
      # different depth than the source it was built from, so a test running
      # from `src` sees a path that works and says nothing about the one that
      # ships. 0.1.0 went out reporting 0.0.0.
      - name: Check the binary reports its own version
        shell: bash
        run: |
          built=$(node packages/cli/dist/bin/venn-run.mjs --version)
          declared=$(node -p "require('./packages/cli/package.json').version")
          echo "binary says $built, manifest says $declared"
          test "$built" = "$declared"
  # The one check the branch rule requires, because it is the only one whose
  # name never moves. A skipped matrix job reports `verify (${{ matrix.os }})`,
  # not the expanded names, and a required check that never reports by the name
  # asked for leaves the pull request waiting forever. This runs either way and
  # answers for the rest.
  gate:
    name: CI
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Answer for the jobs above
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "verify: ${{ needs.verify.result }}"
          # A failure deciding is not a pass. Without this, an API error would
          # skip the tests and report success for having skipped them.
          test "${{ needs.changes.result }}" = "success" || {
            echo "::error::could not decide what to run."; exit 1; }
          case "${{ needs.verify.result }}" in
            success|skipped) echo "Nothing failed." ;;
            *) echo "::error::verify did not pass."; exit 1 ;;
          esac
