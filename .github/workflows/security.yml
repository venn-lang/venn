name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A dependency becomes vulnerable while you are not looking, so this runs
    # whether or not anyone pushed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # The same decision CI makes, for the same reason: scanning a README for
  # vulnerabilities finds none, twice a week, forever.
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/changed
      - id: decide
        uses: ./.github/actions/changed

  audit:
    needs: changes
    name: Dependency audit
    # The release pull request only moves version numbers and changelogs, and
    # is opened by a bot, so its run would wait on a human every release. The
    # dependency tree it audits is the one main was already audited with.
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit
        run: pnpm audit --audit-level=high

  codeql:
    needs: changes
    name: CodeQL
    # The release pull request only moves version numbers and changelogs, and
    # is opened by a bot, so its run would wait on a human every release. The
    # dependency tree it audits is the one main was already audited with.
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # The compiler is the product here, so query it properly rather than
          # with the default set.
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  osv:
    needs: changes
    name: OSV scanner
    if: github.head_ref != 'changeset-release/main' && needs.changes.outputs.code == 'true'
    # Called as a reusable workflow, not as a step: the repository's action.yml
    # carries only metadata and has no `runs:` section, so it cannot be a step.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      # Covers advisories the npm registry's own database does not carry.
      scan-args: |-
        --lockfile=./pnpm-lock.yaml

  # Named for the branch rule to require, for the same reason as in CI: a job
  # skipped by a condition does not always report under the name it would have
  # had, and a required check that never reports blocks the pull request.
  gate:
    name: Security
    needs: [changes, audit, codeql, osv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Answer for the jobs above
        run: |
          test "${{ needs.changes.result }}" = "success" || {
            echo "::error::could not decide what to run."; exit 1; }
          for result in "${{ needs.audit.result }}" "${{ needs.codeql.result }}" "${{ needs.osv.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a security job did not pass: $result"; exit 1 ;;
            esac
          done
          echo "Nothing failed."
