name: Changed
description: Whether anything worth building and testing changed.

inputs:
  also:
    description: >
      A regex of paths that count as code for this caller even though the list
      below reads them as prose. The release needs it: a changeset is a Markdown
      file, and a merge that brings one has a release pull request to refresh.
    required: false
    # Matches nothing, so a caller that passes nothing gets the plain answer.
    default: '$^'

outputs:
  code:
    description: '"true" when something other than prose changed.'
    value: ${{ steps.decide.outputs.code }}

runs:
  using: composite
  steps:
    # Two halves on purpose: asking GitHub what changed, which needs GitHub, and
    # deciding what that means, which does not and so has tests of its own in
    # `decide.sh`.
    - id: decide
      shell: bash
      run: |
        case "$GITHUB_EVENT_NAME" in
          pull_request)
            files=$(gh pr view "$NUMBER" --repo "$REPO" --json files --jq '.files[].path')
            ;;
          push)
            # A new branch, or a force push, reports a parent of all zeroes and
            # nothing to compare against. Build it.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "No previous commit to compare against, so run everything."
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
            ;;
          *)
            echo "Event $GITHUB_EVENT_NAME does not describe a change, so run everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac

        printf '%s' "$files" | bash "$GITHUB_ACTION_PATH/decide.sh"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        NUMBER: ${{ github.event.pull_request.number }}
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.event.after }}
        ALSO: ${{ inputs.also }}
