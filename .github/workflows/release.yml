name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # Empty on a run that only refreshed the version pull request, which is
      # how the SBOM job knows there is no release to attach anything to.
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance: the registry verifies the build came from
      # this workflow, in this repository, at this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -r --sort run build

      # The release pull request skips CI, since it carries no code and its run
      # would wait on a human every time. This is where that verification
      # happens instead: on main, against exactly what is about to be published,
      # which is a better place to check than the pull request that proposed it.
      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # When npm rejects the credentials, changesets reports a bare TypeError
      # from deep inside its own error handling, which says nothing about what
      # went wrong. Asking the registry first turns that into a sentence. It
      # only warns: a run that just opens the version pull request needs no
      # credentials at all, and should not fail for the want of them.
      - name: Check the npm credentials
        continue-on-error: true
        run: |
          if who=$(npm whoami 2>&1); then
            echo "npm accepted the token, authenticated as $who"
          else
            echo "::warning::npm rejected the token: $who. Publishing will fail until the NPM_TOKEN secret is replaced."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Keeps a "Version Packages" pull request up to date while changesets
      # accumulate. Merging it is what publishes.
      #
      # Releases and tags are left off: the action makes one of each per
      # package, which for a language whose packages all share a version means
      # twenty-nine of them saying the same thing, most reading only "Updated
      # dependencies". The step below makes the one release this actually is.
      #
      # `push-git-tags: false` stops the per-package tags reaching the remote,
      # and that is the only way to stop them. `changeset publish --no-git-tag`
      # looks like it would do the same and quietly breaks the run: the action
      # decides whether anything shipped by reading the `git-tag` events the
      # publish emits, so suppressing them reports that nothing was published
      # even as twenty-nine packages go to npm. 0.1.1 shipped that way, with no
      # tag and no release behind it.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # Both names, for two readers of the same secret. `setup-node` writes
          # an .npmrc that reads NODE_AUTH_TOKEN, while the action itself looks
          # for NPM_TOKEN to decide whether it has credentials at all. With only
          # the first, it reported none and fell back to trusted publishing,
          # which nothing here is set up for, and the publish failed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # One tag and one release for the version, since that is what shipped.
      # Runs only when something was actually published, so an ordinary merge
      # that just refreshes the version pull request tags nothing.
      - name: Tag and release the version
        id: release
        if: steps.changesets.outputs.published == 'true'
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          node scripts/release-notes.mjs "$version" > notes.md
          git tag -a "v$version" -m "Venn $version"
          git push origin "v$version"
          gh release create "v$version" --title "Venn $version" --notes-file notes.md
          rm notes.md
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: SBOM
    needs: release
    # Only when a release exists to attach it to. It used to run on every push
    # to main and find the newest tag with `git describe`, which after a merge
    # that published nothing meant attaching today's tree to last week's
    # release.
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # GitHub already derives an SPDX document from the dependency graph. This
      # one is generated from the tree that was actually installed, so it
      # describes the artefact rather than the manifest.
      #
      # cdxgen rather than cyclonedx-npm: the latter reads a package-lock.json,
      # which a pnpm workspace does not have, and produced a valid document with
      # nothing in it. `--required-only` keeps what the published packages
      # actually carry at runtime instead of the whole build toolchain.
      - name: Generate CycloneDX SBOM
        run: pnpm dlx @cyclonedx/cdxgen@11 -t pnpm -o sbom.json --no-recurse --required-only

      # A document with no components is worse than none: it looks like an
      # answer. This is how the empty one went unnoticed in the first place.
      - name: Check the SBOM is not empty
        run: |
          count=$(node -p "require('./sbom.json').components?.length ?? 0")
          echo "components: $count"
          test "$count" -gt 0

      - name: Attach to the release
        run: gh release upload "${{ needs.release.outputs.tag }}" sbom.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
