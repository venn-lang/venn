version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # One pull request per ecosystem beats twenty per week. Majors are left out
    # of the groups on purpose: any of them can break the build, and grouping
    # one would hold every harmless bump behind it until it is sorted out.
    # Security updates stay separate so they are never queued behind a routine
    # bump.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The types have to describe the runtime the project targets, which is
      # Node 24 LTS in .nvmrc, in engines and in the CI matrix. A newer major
      # would type against APIs that are not there to call.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    # pnpm refuses to lock a release younger than a day, so a bump offered on
    # publication day arrives with the build already red and has to sit until it
    # ages out. Waiting here instead is the same wait without the failing run,
    # and it lands on the same side of the argument the pnpm policy is making:
    # a compromised release is usually caught in its first hours.
    # Security updates ignore this and still arrive at once.
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Every action in one pull request, majors included. A pinned action moves
    # by whole majors as its routine release, and there is nothing to review
    # separately in five of them.
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(ci)"
