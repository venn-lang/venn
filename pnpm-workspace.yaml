packages:
  - "packages/*"
  - "benchmarks"

onlyBuiltDependencies:
  - esbuild

# Single source of truth for dependency versions across every package (pnpm catalog).
catalog:
  typescript: ^7.0.2
  "@types/node": ^24
  langium: ^4.4.0
  langium-cli: ^4.4.0
  zod: ^4.6.5
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10
  "@fast-check/vitest": ^0.5.0
  # A real parser for the junit document the CLI writes: a substring match
  # proves nothing about a file a CI job has to read as XML.
  fast-xml-parser: ^5.11.1
  "@biomejs/biome": ^2.5.14
  tsdown: ^0.23.0
  "@changesets/cli": ^2.31.1
  citty: ^0.2.2
  semver: ^7.8.5
  "@types/semver": ^7.8.0
  vscode-languageserver: ^10.1.1
  vscode-languageserver-textdocument: ^1.0.15
  vscode-languageclient: ^9.0.1
  # `@types/vscode` is pinned literally in packages/vscode: `vsce` parses that
  # field as semver to check it against `engines.vscode`, and rejects `catalog:`.
  "@vscode/vsce": ^3.2.2

minimumReleaseAgeExclude:
  - tsdown@0.22.14
  - verkit@0.3.0

# Both are only needed to *publish* to the marketplace (signing, credential
# storage). We only ever run `vsce package`, so their native builds stay off.
allowBuilds:
  '@vscode/vsce-sign': false
  keytar: false

# Pinned above the advisory rather than waiting for vscode-languageclient to
# update its own minimatch. GHSA-mh99-v99m-4gvg: unbounded expansion crashes
# the process.
overrides:
  brace-expansion: ">=5.0.9"
  # Reached only through vite, so it never ships, but a scanner reads the
  # lockfile and not the dependency kind.
  postcss: ">=8.5.23"
  # The fix, not the next major: an advisory is a reason to raise a patch,
  # never a reason to take a version nothing here was written against.
  fast-uri: ">=3.1.5 <4"
  undici: ">=7.29.0 <8"
  # Both majors are in the tree, under two different dev tools, so both need a
  # floor. GHSA-5p4m-2wfm-xmqj: quadratic CPU on `!!omap`, which a lockfile
  # scanner reads whatever the dependency kind.
  "js-yaml@^3": ">=3.15.1 <4"
  "js-yaml@^4": ">=4.3.1 <5"
  # GHSA-2v37-7h3g-55p8: a predictable id when the alphabet is short. Reached
  # through vite, so nothing here generates one, and the fix is a patch.
  nanoid: ">=3.3.17 <4"
